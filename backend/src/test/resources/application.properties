# =========================================================================
# 1. TEST-DATABASE (H2 simulates MySQL)
# =========================================================================
spring.datasource.url=jdbc:h2:mem:zylosDB;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never

# =========================================================================
# 2. FLYWAY 
# =========================================================================
spring.flyway.enabled=true
spring.flyway.clean-disabled=false
spring.jpa.defer-datasource-initialization=false

# =========================================================================
# 3. MAIL-CONFIG MOCKING FOR TESTS
# =========================================================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test-user
spring.mail.password=test-password

# =========================================================================
# 4. APPLICATION SECURITY & FALLBACKS
# =========================================================================
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.jwt.secret=test-secret-key-test-secret-key-test-secret-key-test-secret-key
