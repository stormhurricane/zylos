spring:
  application:
    name: backend
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:einSehrLangerUndSichererGeheimerSchluesselMitMindestens32Zeichen}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    cookie-name: jwt

logging:
  file:
    name: logs/backend.log
  level:
    com.zylos.backend: DEBUG
