# =========================================================================
# 1. DATABASE CONFIGURATION (MySQL)
# =========================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zylos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:zylos_user}
spring.datasource.password=${DB_PASSWORD:zylos_password}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# =========================================================================
# 2. FLYWAY MIGRATION
# =========================================================================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.clean-disabled=false

# =========================================================================
# 3. MAIL CONFIGURATION 
# =========================================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:noreply.deinmoodle@gmail.com}
spring.mail.password=${MAIL_PASSWORD} 
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =========================================================================
# 4. APPLICATION SECURITY & CORS
# =========================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.jwt.secret=${JWT_SECRET:your-fallback-dev-secret-key-for-local-only-2026}