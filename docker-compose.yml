version: '3.8'

services:
  # MySQL-Datenbank
  mysql:
    image: mysql:8.0
    container_name: doodle_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: doodle
      MYSQL_USER: doodle_user
      MYSQL_PASSWORD: doodle_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend (Spring Boot)
  backend:
    build: ./backend
    container_name: doodle_backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database (MySQL statt H2)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/doodle?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_DRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: doodle_user
      SPRING_DATASOURCE_PASSWORD: doodle_pass
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: true
      
      # Mail
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: noreply.deinmoodle@gmail.com
      SPRING_MAIL_PASSWORD: C7jKrssyYcWwFcW
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
      
      # H2 Console (falls noch gebraucht)
      SPRING_H2_CONSOLE_ENABLED: true

volumes:
  mysql_data: