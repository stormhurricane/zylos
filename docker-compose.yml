version: '3.8'

services:
  # Relational Database Service (MySQL)
  db:
    image: mysql:8.0
    container_name: zylos-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: zylos_db
      MYSQL_USER: ${DB_USER:-zylos_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-zylos_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Backend Service (Spring Boot API)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zylos-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # Database Connection (Using the internal 'db' container hostname)
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/zylos_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_DRIVERCLASSNAME: com.mysql.cj.jdbc.Driver
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-zylos_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-zylos_password}
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MySQL8Dialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      
      # Mail Configuration (Using environment variables for production safety)
      SPRING_MAIL_HOST: smtp.gmail.com
      SPRING_MAIL_PORT: 587
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-noreply.deinmoodle@gmail.com}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-C7jKrssyYcWwFcW}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"

  # Frontend Service (React SPA via Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zylos-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data: