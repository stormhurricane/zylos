name: "Frontend CI"

on:
  push:
    branches: ['main', 'dev']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: ['main', 'dev']
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  quality-and-tests:
    name: "Frontend Checks and Build"
    runs-on: 'ubuntu-latest'

    defaults:
      run:
        working-directory: frontend
    
    steps: 
      - name: "Checkout code"
        uses: actions/checkout@v4

      - name: "Set up Node.js"
        uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: "Install dependencies"
        run: npm ci

      - name: "Lint"
        run: npm run lint

      - name: "Typecheck"
        run: npx tsc --noEmit

      - name: "Run tests and generate coverage"
        run: npm run test -- --coverage --watch=false

      - name: "Build frontend"
        run: npm run build

      - name: "Publish code coverage"
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: frontend/coverage/clover.xml
          flags: frontend