name: Continuous Integration

on:
  push:
    branches: [ main, "**" ]
  pull_request:
    branches: [ main ]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
        working-directory: ./frontend
      - name: Run Linting
        run: npm run lint || echo "No lint script found"
        working-directory: ./frontend
      - name: Run Tests
        run: npm test || echo "No test script found"
        working-directory: ./frontend

  backend-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      - name: Build with Maven
        run: mvn clean compile
        working-directory: ./backend
      - name: Run Backend Tests
        run: mvn test
        working-directory: ./backend
        env:
          # Falls Tests eine DB brauchen, nutzen wir hier H2 (in-memory) 
          # oder setzen einen Service Container ein.
          SPRING_PROPERTIES_DATASOURCE_URL: jdbc:h2:mem:testdb
          SPRING_PROPERTIES_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
